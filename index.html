<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A&L Music – 60+ Years of Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page-wrapper">
    <!-- Left content panel -->
    <div class="content-panel">
      <div class="logo">
        <img src="images/al-logo.png" alt="A&L Music – 60+ Years of Play">
      </div>

      <h1>We bring the games. You earn the revenue.</h1>

      <p class="tagline">From jukeboxes and pool tables to darts and arcades, A&L handles the install and upkeep. You earn a share of every play.</p>

      <div class="contact-info">
        819 N. Marshall St.<br>
        Henderson, TX 75652<br>
        (903) 658-0551
      </div>

      <a href="mailto:matt@ALMusic.co" class="btn-get-in-touch">Get in Touch</a>

      <p class="copyright">Copyright &copy;2026 A&amp;L Music</p>
    </div>

    <!-- Slideshow panel -->
    <div class="slideshow-panel">
      <div class="slideshow-slide active">
        <img src="images/slideshow-1.jpg" alt="Jukebox">
      </div>
      <div class="slideshow-slide">
        <img src="images/slideshow-2.jpg" alt="Arcade games">
      </div>
      <div class="slideshow-slide">
        <img src="images/slideshow-3.jpg" alt="Billiards">
      </div>
      <div class="slideshow-slide">
        <img src="images/slideshow-4.jpg" alt="Darts">
      </div>
      <button class="slideshow-arrow prev" aria-label="Previous slide">&#10094;</button>
      <button class="slideshow-arrow next" aria-label="Next slide">&#10095;</button>
    </div>
  </div>

  <script>
    (function() {
      const slides = document.querySelectorAll('.slideshow-slide');
      const prevBtn = document.querySelector('.slideshow-arrow.prev');
      const nextBtn = document.querySelector('.slideshow-arrow.next');
      let current = 0;
      let autoTimer;

      function goTo(index) {
        slides[current].classList.remove('active');
        current = (index + slides.length) % slides.length;
        slides[current].classList.add('active');
      }

      function next() {
        goTo(current + 1);
      }

      function prev() {
        goTo(current - 1);
      }

      function startAuto() {
        autoTimer = setInterval(next, 5000);
      }

      function resetAuto() {
        clearInterval(autoTimer);
        startAuto();
      }

      prevBtn.addEventListener('click', function() {
        prev();
        resetAuto();
      });

      nextBtn.addEventListener('click', function() {
        next();
        resetAuto();
      });

      startAuto();
    })();
  </script>

</body>
</html>
